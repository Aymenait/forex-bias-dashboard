<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3Ahub | Cinema Wall Mobile</title>
    <link rel="stylesheet" href="gate-preview.css">
    <style>
        body {
            margin: 0;
        }

        .mobile-frame {
            width: 390px;
            min-height: 844px;
            margin: 0 auto;
            overflow: hidden;
            border-radius: 34px;
            box-shadow: 0 30px 90px rgba(0, 0, 0, 0.45);
        }

        @media (max-width: 430px) {
            .mobile-frame {
                width: 100%;
                min-height: 100vh;
                border-radius: 0;
            }
        }
    </style>
</head>
<body>
    <div class="mobile-frame">
        <main class="cinematic-gate showcase-gate cinema-focus">
            <div class="cinematic-nebula"></div>
            <div class="cinematic-stars"></div>
            <div class="cinematic-vignette"></div>
            <div class="cinema-wall" aria-hidden="true">
                <div class="cinema-tile"><img src="https://i.imgur.com/hEiJhso.gif" alt=""></div>
                <div class="cinema-tile"><img src="https://i.pinimg.com/1200x/ac/29/4c/ac294c4a7fb6ec4932b5b435260b53bc.jpg" alt=""></div>
                <div class="cinema-tile"><img src="https://i.pinimg.com/736x/71/8b/41/718b41945aab84bd2276c762266931d0.jpg" alt=""></div>
                <div class="cinema-tile"><img src="https://i.pinimg.com/originals/67/9d/aa/679daac8c726277e809c6413a650c547.gif" alt=""></div>
                <div class="cinema-tile"><video autoplay loop muted playsinline src="https://i.imgur.com/mEy5oXF.mp4"></video></div>
                <div class="cinema-tile"><img src="https://i.pinimg.com/originals/98/59/12/98591272861e66a02eecf5dae0450c73.gif" alt=""></div>
                <div class="cinema-tile"><img src="https://i.pinimg.com/1200x/38/e3/08/38e308732b87069ed50893423f09ca4b.jpg" alt=""></div>
                <div class="cinema-tile"><img src="https://i.pinimg.com/736x/c2/5b/dd/c25bdda8e7d4eb27bcb2f4d411441d92.jpg" alt=""></div>
            </div>
            <section class="cinematic-center">
                <div>
                    <div class="cinematic-mark"><img src="logo.png" alt="3Ahub"></div>
                    <h1 class="cinematic-title">Entrez <em>3Ahub</em></h1>
                    <p class="cinematic-subtitle">Cinematic product wall</p>
                    <a class="entry-link" href="#">Enter</a>
                </div>
            </section>
        </main>
    </div>
</body>
</html>
