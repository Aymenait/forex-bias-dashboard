<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>تنظيف مستندات Firebase الشبحية</title>
    <style>
        body { font-family: system-ui; background: #1a1a2e; color: #eee; padding: 20px; max-width: 900px; margin: 0 auto; }
        h1 { color: #d4a843; }
        .btn { padding: 12px 24px; border: none; border-radius: 8px; cursor: pointer; font-size: 16px; margin: 5px; font-weight: bold; }
        .btn-scan { background: #3b82f6; color: white; }
        .btn-clean { background: #ef4444; color: white; }
        .btn-clean:disabled { background: #666; cursor: not-allowed; }
        .log { background: #0d1117; border: 1px solid #333; border-radius: 8px; padding: 15px; margin: 15px 0; max-height: 500px; overflow-y: auto; font-family: monospace; font-size: 13px; white-space: pre-wrap; }
        .ghost { color: #ef4444; }
        .canonical { color: #22c55e; }
        .info { color: #3b82f6; }
        .warn { color: #f59e0b; }
        table { width: 100%; border-collapse: collapse; margin: 15px 0; }
        th, td { padding: 8px 12px; border: 1px solid #333; text-align: right; }
        th { background: #1e293b; color: #d4a843; }
        .ghost-row { background: rgba(239, 68, 68, 0.1); }
    </style>
</head>
<body>
    <h1>تنظيف مستندات Firebase الشبحية</h1>
    <p>هذه الأداة تفحص مجموعة <code>products_v2</code> وتحدد المستندات الشبحية (القديمة/المكررة) التي تسبب عودة العروض المحذوفة.</p>

    <div>
        <button class="btn btn-scan" onclick="scanFirebase()">فحص Firebase</button>
        <button class="btn btn-clean" id="cleanBtn" onclick="cleanGhostDocs()" disabled>حذف المستندات الشبحية</button>
    </div>

    <div id="results"></div>
    <div class="log" id="log"></div>

    <script type="module">
        import { initializeApp } from 'https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js';
        import { getFirestore, collection, getDocs, deleteDoc, doc, getDoc } from 'https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js';

        const firebaseConfig = {
            apiKey: "AIzaSyCqOSFzxOVrVraBv4QtZMnVMCh1xVqZ8fw",
            authDomain: "the-real-world-review.firebaseapp.com",
            projectId: "the-real-world-review",
            storageBucket: "the-real-world-review.firebasestorage.app",
            messagingSenderId: "324349726142",
            appId: "1:324349726142:web:eff2cde07b569ed0a3bdef"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        const GHOST_TO_CANONICAL = {
            'canva':                    'canva-pro',
            'netflix':                  'netflix-premium',
            'duolingo':                 'duolingo-super',
            'primevideo':               'prime-video',
            'lovable':                  'lovable-ai',
            'cursor':                   'cursor-ai',
            'perplexity':               'perplexity-ai-pro',
            'the-real-world-account':   'trw',
            'google-gemini-pro-veo-3':  'google-ai',
            'capcut-pro':               'capcut',
            'gama-ai-pro':              'gamma',
            'youtube-premium':          'youtube',
            'microsoft-office-365':     'microsoft-office'
        };

        let ghostDocs = [];

        function log(msg, type = '') {
            const el = document.getElementById('log');
            const span = document.createElement('span');
            span.className = type;
            span.textContent = msg + '\n';
            el.appendChild(span);
            el.scrollTop = el.scrollHeight;
        }

        window.scanFirebase = async function() {
            const logEl = document.getElementById('log');
            logEl.innerHTML = '';
            ghostDocs = [];

            log('جاري فحص products_v2...', 'info');

            try {
                const snapshot = await getDocs(collection(db, 'products_v2'));
                const allDocs = [];

                snapshot.forEach(docItem => {
                    allDocs.push({ id: docItem.id, data: docItem.data() });
                });

                log(`تم العثور على ${allDocs.length} مستند في products_v2`, 'info');

                const canonicalIds = new Set(Object.values(GHOST_TO_CANONICAL));
                const ghostIds = new Set(Object.keys(GHOST_TO_CANONICAL));

                let tableHTML = '<table><tr><th>معرف المستند</th><th>الحالة</th><th>المعرف الأساسي</th><th>عدد العروض الفرعية</th><th>displayOrder</th></tr>';

                for (const doc of allDocs) {
                    const isGhost = ghostIds.has(doc.id);
                    const isCanonical = !isGhost;
                    const subOffers = Array.isArray(doc.data.subOffers) ? doc.data.subOffers.length : 0;
                    const displayOrder = doc.data.displayOrder ?? doc.data.order ?? 'غير محدد';

                    if (isGhost) {
                        const canonical = GHOST_TO_CANONICAL[doc.id];
                        ghostDocs.push(doc);
                        tableHTML += `<tr class="ghost-row"><td>${doc.id}</td><td>🔴 شبح</td><td>${canonical}</td><td>${subOffers}</td><td>${displayOrder}</td></tr>`;
                        log(`🔴 شبح: ${doc.id} → يجب أن يكون ${canonical} (${subOffers} عروض فرعية)`, 'ghost');
                    } else {
                        tableHTML += `<tr><td>${doc.id}</td><td>✅ أساسي</td><td>-</td><td>${subOffers}</td><td>${displayOrder}</td></tr>`;
                        log(`✅ أساسي: ${doc.id} (${subOffers} عروض فرعية, order: ${displayOrder})`, 'canonical');
                    }
                }

                tableHTML += '</table>';
                document.getElementById('results').innerHTML = tableHTML;

                if (ghostDocs.length > 0) {
                    log(`\n⚠️ تم العثور على ${ghostDocs.length} مستند شبحي يجب حذفه`, 'warn');
                    document.getElementById('cleanBtn').disabled = false;
                } else {
                    log('\n✅ لا توجد مستندات شبحية!', 'canonical');
                }

                // Check legacy collection too
                log('\nجاري فحص products (القديمة)...', 'info');
                const legacySnapshot = await getDocs(collection(db, 'products'));
                let legacyGhosts = 0;
                legacySnapshot.forEach(docItem => {
                    if (ghostIds.has(docItem.id)) {
                        legacyGhosts++;
                        log(`🔴 شبح في products: ${docItem.id}`, 'ghost');
                    }
                });
                if (legacyGhosts > 0) {
                    log(`⚠️ ${legacyGhosts} مستند شبحي في مجموعة products القديمة`, 'warn');
                }

            } catch (error) {
                log('❌ خطأ: ' + error.message, 'ghost');
            }
        };

        window.cleanGhostDocs = async function() {
            if (ghostDocs.length === 0) {
                log('لا توجد مستندات للحذف', 'warn');
                return;
            }

            if (!confirm(`هل أنت متأكد من حذف ${ghostDocs.length} مستند شبحي؟ هذا لا يمكن التراجع عنه.`)) {
                return;
            }

            log('\nجاري حذف المستندات الشبحية...', 'warn');

            for (const ghost of ghostDocs) {
                try {
                    await deleteDoc(doc(db, 'products_v2', ghost.id));
                    log(`✅ تم حذف ${ghost.id} من products_v2`, 'canonical');
                } catch (error) {
                    log(`❌ فشل حذف ${ghost.id}: ${error.message}`, 'ghost');
                }

                try {
                    await deleteDoc(doc(db, 'products', ghost.id));
                    log(`✅ تم حذف ${ghost.id} من products`, 'canonical');
                } catch (error) {
                    // قد لا يكون موجود في المجموعة القديمة
                }
            }

            log('\n✅ تم الانتهاء من التنظيف! أعد تحميل الموقع لرؤية النتائج.', 'canonical');
            document.getElementById('cleanBtn').disabled = true;
            ghostDocs = [];
        };
    </script>
</body>
</html>
