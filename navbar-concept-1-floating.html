<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Concept 1 — Floating Pill</title>
<style>
  :root{
    --bg:#05070d; --gold:#ffd56f; --gold-strong:#f0aa33; --blue:#66c0f4;
    --text:#f7fafc; --muted:#aab6c8; --border:rgba(255,255,255,.1);
  }
  *{box-sizing:border-box;margin:0;padding:0;font-family:"Segoe UI",Tahoma,system-ui,sans-serif}
  body{
    min-height:100vh;color:var(--text);
    background:
      radial-gradient(circle at 78% 14%,rgba(102,192,244,.16),transparent 34%),
      radial-gradient(circle at 16% 40%,rgba(255,213,111,.12),transparent 30%),
      radial-gradient(circle at 68% 82%,rgba(255,107,138,.1),transparent 34%),
      var(--bg);
  }
  .label{position:fixed;top:14px;inset-inline-start:18px;font-size:.8rem;color:var(--muted);
    background:rgba(0,0,0,.4);padding:6px 12px;border-radius:8px;border:1px solid var(--border);z-index:99}
  svg{width:16px;height:16px;flex-shrink:0}

  /* ===== Floating pill ===== */
  .topwrap{position:sticky;top:18px;display:flex;justify-content:center;padding:0 16px;z-index:50}
  .pill{
    width:min(100%,1120px);display:flex;align-items:center;gap:26px;
    padding:10px 14px 10px 22px;border-radius:999px;
    border:1px solid rgba(255,255,255,.09);
    background:linear-gradient(180deg,rgba(28,36,54,.78),rgba(9,13,21,.9));
    box-shadow:0 1px 0 rgba(255,255,255,.06) inset,0 24px 60px -22px rgba(0,0,0,.7),0 0 0 1px rgba(255,213,111,.05);
    backdrop-filter:blur(22px) saturate(1.1);
  }
  .brand{display:flex;align-items:center;gap:11px;flex-shrink:0}
  .brand img{width:42px;height:42px;border-radius:12px;padding:3px;
    background:radial-gradient(circle at 30% 25%,rgba(255,213,111,.3),rgba(255,255,255,.04));
    box-shadow:0 0 0 1px rgba(255,213,111,.25)}
  .brand b{font-size:1.25rem;background:linear-gradient(120deg,#fff6dc,#ffd56f 55%,#f2b33d);
    -webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;letter-spacing:.3px}

  .links{display:flex;align-items:center;gap:6px;margin-inline:auto}
  .links a{display:flex;align-items:center;gap:7px;color:var(--muted);text-decoration:none;font-weight:600;font-size:.95rem;
    padding:9px 16px;border-radius:999px;transition:.25s}
  .links a:hover{color:#fff;background:rgba(255,255,255,.06)}
  .links a.active{color:#fff;background:rgba(255,213,111,.12);box-shadow:inset 0 0 0 1px rgba(255,213,111,.3)}
  .links a.games{color:var(--blue)}
  .badge{font-size:.62rem;background:rgba(102,192,244,.2);padding:2px 6px;border-radius:6px;margin-inline-start:4px}

  .actions{display:flex;align-items:center;gap:8px;flex-shrink:0}
  .chip{display:flex;align-items:center;gap:7px;color:var(--text);font-weight:700;font-size:.85rem;cursor:pointer;
    padding:9px 13px;border-radius:999px;border:1px solid rgba(255,255,255,.1);background:rgba(255,255,255,.04);transition:.25s}
  .chip:hover{border-color:rgba(255,213,111,.4);background:rgba(255,213,111,.08)}
  .chip .car{width:11px;height:11px;color:var(--muted)}
  .cta{padding:10px 20px;border-radius:999px;font-weight:800;font-size:.9rem;text-decoration:none;
    color:#1a1205;background:linear-gradient(135deg,#ffe39a,#ffce5e 55%,#f0aa33);
    box-shadow:0 8px 22px -8px rgba(255,196,77,.7)}

  /* hero hint */
  .hero{max-width:1120px;margin:90px auto 0;padding:0 24px;text-align:center}
  .hero h1{font-size:3rem;line-height:1.1;margin-bottom:14px}
  .hero h1 span{color:var(--gold)}
  .hero p{color:var(--muted);font-size:1.1rem}
</style>
</head>
<body>
  <div class="label">Concept 1 — شريط عائم مدمج (Floating Pill)</div>

  <div class="topwrap">
    <nav class="pill">
      <div class="brand">
        <img src="https://i.imgur.com/hyjvY4Z.png" alt="3Ahub">
        <b>3Ahub</b>
      </div>
      <div class="links">
        <a href="#" class="active">منتجاتنا</a>
        <a href="#">
          <svg viewBox="0 0 24 24" fill="#ffd56f"><path d="M12 2l3.09 6.26L22 9.27l-5 4.87 1.18 6.88L12 17.77l-6.18 3.25L7 14.14 2 9.27l6.91-1.01L12 2z"/></svg>
          آراء العملاء
        </a>
        <a href="#">موزّعين</a>
        <a href="#" class="games">ألعاب<span class="badge">قريباً</span></a>
      </div>
      <div class="actions">
        <div class="chip">عربية
          <svg class="car" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="6 9 12 15 18 9"/></svg>
        </div>
        <div class="chip">DZD
          <svg class="car" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="6 9 12 15 18 9"/></svg>
        </div>
        <a href="#" class="cta">اطلب الآن</a>
      </div>
    </nav>
  </div>

  <div class="hero">
    <h1>منصّتك المتكاملة لكل <span>الخدمات الرقمية</span></h1>
    <p>حسابات تعليمية، أدوات إبداعية، وحلول ذكاء اصطناعي بأفضل الأسعار.</p>
  </div>
</body>
</html>
