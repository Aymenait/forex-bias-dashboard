<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>آراء العملاء - Market Algeriaa</title>
    
    <!-- Preconnect for performance -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    
    <!-- Use main site styles -->
    <link rel="stylesheet" href="style.css?v=reviews">
    
    <style>
        /* Reviews Page Specific Styles */
        body {
            background: var(--bg-dark);
            position: relative;
        }
        
        #particles-js {
            position: fixed;
            width: 100%;
            height: 100%;
            top: 0;
            left: 0;
            z-index: 0;
            pointer-events: none;
        }
        
        .reviews-page-header {
            position: relative;
            z-index: 1;
            padding: 80px 0 60px;
            text-align: center;
        }
        
        .reviews-page-header .logo {
            width: 80px;
            height: 80px;
            margin: 0 auto var(--spacing-md);
            display: block;
        }
        
        .reviews-page-header h1 {
            font-size: clamp(2.5rem, 5vw, 4rem);
            font-weight: 800;
            margin-bottom: var(--spacing-md);
            color: var(--text-primary);
        }
        
        .reviews-page-header p {
            font-size: 1.2rem;
            color: var(--text-secondary);
            margin-bottom: var(--spacing-2xl);
        }
        
        .reviews-stats {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: var(--spacing-2xl);
            margin-bottom: var(--spacing-2xl);
        }
        
        .stat-item {
            text-align: center;
        }
        
        .stat-item .number {
            font-size: 2.5rem;
            font-weight: 700;
            color: var(--accent);
            display: block;
            margin-bottom: var(--spacing-sm);
        }
        
        .stat-item .label {
            color: var(--text-secondary);
            font-size: 1rem;
        }
        
        .reviews-actions {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: var(--spacing-md);
            margin-bottom: var(--spacing-2xl);
        }
        
        .filter-btn {
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            color: var(--text-primary);
            padding: 10px 24px;
            border-radius: var(--radius-full);
            font-weight: 600;
            cursor: pointer;
            transition: all var(--transition-base);
        }
        
        .filter-btn:hover {
            background: rgba(255, 255, 255, 0.1);
            transform: translateY(-2px);
        }
        
        .filter-btn.active {
            background: var(--accent);
            color: #1b1d32;
            border-color: var(--accent);
        }
        
        /* Product badges for all products */
        .badge-gamma {
            background: linear-gradient(135deg, #6366f1, #8b5cf6);
            color: #fff;
        }
        
        .badge-netflix {
            background: linear-gradient(135deg, #e50914, #b20710);
            color: #fff;
        }
        
        .badge-perplexity {
            background: linear-gradient(135deg, #1FB6FF, #0ea5e9);
            color: #fff;
        }
        
        .badge-tradingview {
            background: linear-gradient(135deg, #2962FF, #1e40af);
            color: #fff;
        }
        
        .badge-canva {
            background: linear-gradient(135deg, #00c4cc, #00a8b5);
            color: #fff;
        }
        
        .badge-capcut {
            background: linear-gradient(135deg, #ff6b6b, #ee5a6f);
            color: #fff;
        }
        
        #reviews-container {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: var(--spacing-lg);
            max-width: 1200px;
            margin: 0 auto;
            padding: 0 var(--spacing-md);
            position: relative;
            z-index: 1;
        }
        
        .review-card {
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: var(--radius-lg);
            padding: var(--spacing-lg);
            box-shadow: var(--shadow);
            transition: all var(--transition-base);
            backdrop-filter: blur(10px);
        }
        
        .review-card:hover {
            transform: translateY(-8px);
            box-shadow: 0 32px 80px rgba(15, 17, 35, 0.6);
            border-color: rgba(255, 213, 111, 0.2);
        }
        
        .review-header {
            display: flex;
            justify-content: space-between;
            align-items: start;
            margin-bottom: var(--spacing-md);
        }
        
        .review-name {
            font-weight: 700;
            color: var(--text-primary);
            font-size: 1.1rem;
        }
        
        .review-rating {
            display: flex;
            align-items: center;
            gap: 4px;
            margin-top: 6px;
        }
        
        .review-rating svg {
            width: 18px;
            height: 18px;
            transition: transform 0.2s ease;
        }
        
        .review-rating svg:hover {
            transform: scale(1.1);
        }
        
        .review-product {
            display: inline-block;
            padding: 4px 12px;
            border-radius: var(--radius-full);
            font-size: 0.75rem;
            font-weight: 700;
            margin-bottom: var(--spacing-sm);
        }
        
        .badge-trw {
            background: linear-gradient(135deg, #39ff14, #2ecc71);
            color: #000;
        }
        
        .badge-chatgpt {
            background: linear-gradient(135deg, #10a37f, #0d8c6a);
            color: #fff;
        }
        
        .badge-adobe {
            background: linear-gradient(135deg, #ff0000, #cc0000);
            color: #fff;
        }
        
        .review-comment {
            color: var(--text-secondary);
            line-height: 1.6;
            margin-bottom: var(--spacing-md);
        }
        
        .review-meta {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 0.85rem;
            color: var(--text-secondary);
        }
        
        .review-image {
            width: 100%;
            border-radius: var(--radius-md);
            margin-top: var(--spacing-md);
            cursor: pointer;
            transition: transform var(--transition-base);
        }
        
        .review-image:hover {
            transform: scale(1.05);
        }
        
        .back-to-home-btn {
            position: fixed;
            top: var(--spacing-lg);
            left: var(--spacing-lg);
            z-index: 100;
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            color: var(--text-primary);
            padding: 12px 24px;
            border-radius: var(--radius-full);
            text-decoration: none;
            display: flex;
            align-items: center;
            gap: var(--spacing-sm);
            transition: all var(--transition-base);
            backdrop-filter: blur(10px);
        }
        
        .back-to-home-btn:hover {
            background: rgba(255, 255, 255, 0.1);
            transform: translateY(-2px);
        }
        
        .reviews-lang-switcher {
            position: fixed;
            top: var(--spacing-lg);
            right: var(--spacing-lg);
            z-index: 100;
            display: flex;
            gap: var(--spacing-sm);
            background: var(--card-bg);
            padding: 4px;
            border-radius: var(--radius-full);
            border: 1px solid var(--border-color);
            backdrop-filter: blur(10px);
        }
        
        .loading-spinner {
            display: inline-block;
            width: 48px;
            height: 48px;
            border: 4px solid rgba(255, 255, 255, 0.1);
            border-top-color: var(--accent);
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }
        
        @keyframes spin {
            to { transform: rotate(360deg); }
        }
        
        #loading, #no-reviews {
            text-align: center;
            padding: var(--spacing-2xl);
            color: var(--text-secondary);
        }
        
        #show-more-container {
            text-align: center;
            margin-top: var(--spacing-xl);
            margin-bottom: var(--spacing-xl);
            padding: var(--spacing-lg) var(--spacing-md);
            position: relative;
            z-index: 1;
            width: 100%;
            max-width: 1200px;
            margin-left: auto;
            margin-right: auto;
            box-sizing: border-box;
        }
        
        #show-more-btn {
            margin: 0 auto;
            display: inline-block;
        }
        
        @media (max-width: 768px) {
            .reviews-page-header {
                padding: 60px 0 40px;
            }
            
            .reviews-page-header .logo {
                width: 60px;
                height: 60px;
                margin-bottom: var(--spacing-sm);
            }
            
            #reviews-container {
                grid-template-columns: repeat(2, 1fr);
                gap: var(--spacing-sm);
                padding: 0 var(--spacing-xs);
            }
            
            .review-card {
                padding: var(--spacing-sm);
                border-radius: var(--radius-md);
            }
            
            .review-name {
                font-size: 0.9rem;
            }
            
            .review-rating svg {
                width: 14px;
                height: 14px;
            }
            
            .review-comment {
                font-size: 0.85rem;
                line-height: 1.4;
                margin-bottom: var(--spacing-sm);
            }
            
            .review-meta {
                font-size: 0.75rem;
                flex-direction: column;
                align-items: flex-start;
                gap: 4px;
            }
            
            .review-header {
                flex-direction: column;
                gap: var(--spacing-xs);
                margin-bottom: var(--spacing-sm);
            }
            
            .product-badge {
                font-size: 0.7rem;
                padding: 2px 8px;
            }
            
            .review-image {
                margin-top: var(--spacing-sm);
            }
            
            .back-to-home-btn,
            .reviews-lang-switcher {
                position: relative;
                top: auto;
                left: auto;
                right: auto;
                margin: var(--spacing-md);
            }
            
            #show-more-container {
                margin-top: var(--spacing-lg);
                margin-bottom: var(--spacing-lg);
                padding: var(--spacing-md) var(--spacing-md);
                max-width: 100%;
                box-sizing: border-box;
            }
        }
        
        @media (max-width: 480px) {
            #reviews-container {
                grid-template-columns: repeat(2, 1fr);
                gap: 8px;
                padding: 0 4px;
            }
            
            .review-card {
                padding: 10px;
                border-radius: var(--radius-sm);
            }
            
            .review-name {
                font-size: 0.85rem;
            }
            
            .review-comment {
                font-size: 0.8rem;
                line-height: 1.3;
                margin-bottom: 8px;
            }
            
            .review-meta {
                font-size: 0.7rem;
            }
            
            .review-rating svg {
                width: 12px;
                height: 12px;
            }
            
            #show-more-container {
                margin-top: var(--spacing-md);
                margin-bottom: var(--spacing-md);
                padding: var(--spacing-sm) var(--spacing-md);
                max-width: 100%;
                box-sizing: border-box;
            }
        }
    </style>
</head>
<body>
    <!-- Particles Background -->
    <div id="particles-js"></div>
    
    <!-- Back to Home Button -->
    <a href="index.html" class="back-to-home-btn">
        <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M19 12H5M12 19l-7-7 7-7"/>
        </svg>
        <span data-i18n="back.home">الرئيسية</span>
    </a>

    <!-- Language Switcher -->
    <div class="reviews-lang-switcher">
        <button onclick="changeLanguage('ar')" class="lang-btn active" data-lang="ar">العربية</button>
        <button onclick="changeLanguage('en')" class="lang-btn" data-lang="en">English</button>
        <button onclick="changeLanguage('fr')" class="lang-btn" data-lang="fr">Français</button>
    </div>

    <!-- Header -->
    <div class="container">
        <div class="reviews-page-header">
            <img src="https://i.imgur.com/8D1hNuQ.png" alt="Market Algeriaa Logo" class="logo" width="80" height="80" loading="eager">
            <h1>
                <span data-i18n="title">⭐ آراء عملائنا</span>
            </h1>
            <p data-i18n="subtitle">
                تقييمات حقيقية من عملاء راضين عن خدماتنا
            </p>
            
            <!-- Stats -->
            <div class="reviews-stats">
                <div class="stat-item">
                    <span class="number" id="total-reviews-count">0</span>
                    <span class="label" data-i18n="stats.reviews">تقييم</span>
                </div>
                <div class="stat-item">
                    <span class="number" id="average-rating">5.0</span>
                    <span class="label" data-i18n="stats.average">متوسط التقييم</span>
                </div>
                <div class="stat-item">
                    <span class="number">10</span>
                    <span class="label" data-i18n="stats.products">منتجات</span>
                </div>
            </div>

            <!-- Add Review Button -->
            <div class="reviews-actions">
                <button id="add-review-btn" class="btn primary" style="display: inline-flex; align-items: center; gap: 8px;">
                    <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M12 5v14M5 12h14"/>
                    </svg>
                    <span id="add-review-btn-text" data-i18n="addReview.shareExperience">⭐ شارك تجربتك معنا</span>
                </button>
            </div>

            <!-- Filter Buttons -->
            <div class="reviews-actions" style="flex-wrap: wrap; gap: 10px;">
                <button onclick="filterReviews('all')" class="filter-btn active" data-i18n="filter.all">الكل</button>
                <button onclick="filterReviews('trw')" class="filter-btn" data-i18n="filter.trw">The Real World</button>
                <button onclick="filterReviews('chatgpt')" class="filter-btn" data-i18n="filter.chatgpt">ChatGPT Business</button>
                <button onclick="filterReviews('adobe')" class="filter-btn" data-i18n="filter.adobe">Adobe Creative Cloud</button>
                <button onclick="filterReviews('gamma')" class="filter-btn" data-i18n="filter.gamma">Gamma.AI</button>
                <button onclick="filterReviews('netflix')" class="filter-btn" data-i18n="filter.netflix">Netflix Premium</button>
                <button onclick="filterReviews('perplexity')" class="filter-btn" data-i18n="filter.perplexity">Perplexity AI Pro</button>
                <button onclick="filterReviews('tradingview')" class="filter-btn" data-i18n="filter.tradingview">TradingView Premium</button>
                <button onclick="filterReviews('canva')" class="filter-btn" data-i18n="filter.canva">Canva Pro</button>
                <button onclick="filterReviews('capcut')" class="filter-btn" data-i18n="filter.capcut">CapCut Pro</button>
                <button onclick="filterReviews('cursor')" class="filter-btn" data-i18n="filter.cursor">Cursor AI</button>
            </div>
        </div>

        <!-- Reviews Grid -->
        <div id="reviews-container">
            <!-- Reviews will be loaded here -->
        </div>

        <!-- Loading Indicator -->
        <div id="loading" style="display: none;">
            <div class="loading-spinner"></div>
            <p style="margin-top: var(--spacing-md);" data-i18n="loading">جاري تحميل التقييمات...</p>
        </div>

        <!-- No Reviews Message -->
        <div id="no-reviews" class="hidden">
            <p style="font-size: 1.2rem;" data-i18n="no.reviews">لا توجد تقييمات بعد</p>
        </div>

        <!-- Show More Button -->
        <div id="show-more-container" style="display: none;">
            <button id="show-more-btn" onclick="loadMoreReviews()" class="btn secondary" data-i18n="show.more">
                عرض المزيد
            </button>
        </div>
    </div>

    <!-- Image Modal -->
    <div id="image-modal" class="modal hidden" onclick="closeImageModal()">
        <div class="modal-content" onclick="event.stopPropagation()">
            <button class="close-btn" onclick="closeImageModal()">&times;</button>
            <img id="modal-image" src="" alt="Review Image" style="max-width: 100%; max-height: 90vh; border-radius: var(--radius-md);">
        </div>
    </div>

    <!-- Add Review Modal -->
    <div id="add-review-modal" class="modal hidden" onclick="closeAddReviewModalOnBackdrop(event)">
        <div class="modal-content review-modal-content" onclick="event.stopPropagation()">
            <button class="close-btn" onclick="event.stopPropagation(); closeAddReviewModal();">&times;</button>
            
            <h2 class="modal-title" data-i18n="addReview.title">أضف تقييمك</h2>
            
            <form id="add-review-form" class="review-form">
                <div>
                    <label data-i18n="addReview.name">الاسم:</label>
                    <input type="text" id="review-name" required placeholder="أدخل اسمك">
                </div>

                <div>
                    <label data-i18n="addReview.product">المنتج:</label>
                    <select id="review-product" required>
                        <option value="The Real World">The Real World</option>
                        <option value="ChatGPT Business">ChatGPT Business</option>
                        <option value="Adobe Creative Cloud">Adobe Creative Cloud</option>
                        <option value="Gamma.AI">Gamma.AI</option>
                        <option value="Canva Pro">Canva Pro</option>
                        <option value="CapCut Pro">CapCut Pro</option>
                        <option value="Netflix Premium">Netflix Premium</option>
                        <option value="Perplexity AI Pro">Perplexity AI Pro</option>
                        <option value="TradingView Premium">TradingView Premium</option>
                    </select>
                </div>

                <div>
                    <label data-i18n="addReview.source">من أين عرفت عنا؟</label>
                    <select id="review-source" required>
                        <option value="" data-i18n="addReview.selectSource">اختر المصدر</option>
                        <option value="Instagram">📸 Instagram</option>
                        <option value="Facebook">👥 Facebook</option>
                        <option value="Twitter">🐦 Twitter/X</option>
                        <option value="TikTok">🎵 TikTok</option>
                        <option value="WhatsApp">💬 WhatsApp</option>
                        <option value="YouTube">📺 YouTube</option>
                        <option value="Google">🔍 Google</option>
                        <option value="Friend" data-i18n="addReview.friend">👤 صديق</option>
                        <option value="Other" data-i18n="addReview.other">🌐 أخرى</option>
                    </select>
                </div>

                <div>
                    <label data-i18n="addReview.rating">التقييم:</label>
                    <div id="star-rating" class="star-rating">
                        <span class="star-input" data-rating="1">☆</span>
                        <span class="star-input" data-rating="2">☆</span>
                        <span class="star-input" data-rating="3">☆</span>
                        <span class="star-input" data-rating="4">☆</span>
                        <span class="star-input" data-rating="5">☆</span>
                    </div>
                    <input type="hidden" id="review-rating" required>
                </div>

                <div>
                    <label data-i18n="addReview.comment">التعليق:</label>
                    <textarea id="review-comment" required rows="4" placeholder="شارك تجربتك معنا..."></textarea>
                </div>

                <button type="submit" class="btn primary" data-i18n="addReview.submit">
                    إرسال التقييم
                </button>
            </form>
        </div>
    </div>

    <!-- Define functions first -->
    <script>
        // Override closeAddReviewModal to ensure it works correctly
        window.closeAddReviewModal = function() {
            const modal = document.getElementById('add-review-modal');
            if (modal) {
                modal.classList.add('hidden');
                modal.classList.remove('show');
                modal.classList.remove('flex');
                
                // Reset form
                const form = document.getElementById('add-review-form');
                if (form) form.reset();
                
                // Reset rating
                const ratingInput = document.getElementById('review-rating');
                if (ratingInput) ratingInput.value = '';
                
                // Reset stars
                document.querySelectorAll('.star-input').forEach(star => {
                    star.textContent = '☆';
                    star.style.color = 'var(--text-secondary)';
                    star.classList.remove('text-yellow-400');
                    star.classList.add('text-gray-300');
                });
            }
        };
        
        window.closeAddReviewModalOnBackdrop = function(event) {
            if (event.target.id === 'add-review-modal') {
                window.closeAddReviewModal();
            }
        };
        
        function closeImageModal() {
            const modal = document.getElementById('image-modal');
            if (modal) {
                modal.classList.add('hidden');
                modal.classList.remove('show');
            }
        }
    </script>

    <!-- Initialize particles and button -->
    <script src="https://cdn.jsdelivr.net/npm/particles.js@2.0.0/particles.min.js"></script>
    <script>
        // Initialize particles with enhanced visibility
        if (typeof particlesJS !== 'undefined') {
            particlesJS('particles-js', {
                particles: {
                    number: { value: 80, density: { enable: true, value_area: 800 } },
                    color: { value: '#ffd56f' },
                    shape: { type: 'circle' },
                    opacity: { 
                        value: 0.6, 
                        random: true,
                        anim: { enable: true, speed: 1, opacity_min: 0.3, sync: false }
                    },
                    size: { 
                        value: 4, 
                        random: true,
                        anim: { enable: true, speed: 2, size_min: 2, sync: false }
                    },
                    line_linked: { 
                        enable: true, 
                        distance: 150, 
                        color: '#ffd56f', 
                        opacity: 0.4, 
                        width: 1.5 
                    },
                    move: { 
                        enable: true, 
                        speed: 2, 
                        direction: 'none', 
                        random: false, 
                        straight: false, 
                        out_mode: 'out', 
                        bounce: false 
                    }
                },
                interactivity: {
                    detect_on: 'canvas',
                    events: { 
                        onhover: { enable: true, mode: 'repulse' }, 
                        onclick: { enable: true, mode: 'push' }, 
                        resize: true 
                    },
                    modes: { 
                        grab: { distance: 400, line_linked: { opacity: 1 } }, 
                        bubble: { distance: 400, size: 40, duration: 2, opacity: 8, speed: 3 }, 
                        repulse: { distance: 200, duration: 0.4 }, 
                        push: { particles_nb: 4 }, 
                        remove: { particles_nb: 2 } 
                    }
                },
                retina_detect: true
            });
        }
        
        // Initialize add review button
        document.addEventListener('DOMContentLoaded', function() {
            const btn = document.getElementById('add-review-btn');
            if (btn) {
                btn.onclick = function() {
                    const modal = document.getElementById('add-review-modal');
                    if (modal) {
                        modal.classList.remove('hidden');
                        modal.classList.add('show');
                        modal.classList.add('flex');
                    }
                };
            }
