<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3Ahub AI - Admin Dashboard</title>
    <style>
        :root {
            --primary: #2563eb;
            --bg: #f8fafc;
            --card-bg: #ffffff;
            --text-main: #1e293b;
            --text-muted: #64748b;
        }

        body {
            font-family: 'Segoe UI', system-ui, sans-serif;
            background: var(--bg);
            color: var(--text-main);
            margin: 0;
            padding: 40px;
        }

        .container {
            max-width: 1000px;
            margin: 0 auto;
        }

        h1 {
            text-align: center;
            margin-bottom: 40px;
            color: #0f172a;
        }

        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 20px;
            margin-bottom: 40px;
        }

        .card {
            background: var(--card-bg);
            padding: 25px;
            border-radius: 16px;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
            text-align: center;
            border: 1px solid #e2e8f0;
        }

        .card h3 {
            margin: 0 0 10px 0;
            font-size: 16px;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .card .value {
            font-size: 48px;
            font-weight: 800;
            color: var(--primary);
            margin: 0;
        }

        .card .sub {
            font-size: 14px;
            color: var(--text-muted);
            margin-top: 5px;
        }

        .feedback-section {
            background: var(--card-bg);
            padding: 30px;
            border-radius: 16px;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
            border: 1px solid #e2e8f0;
        }

        .feedback-section h2 {
            margin-top: 0;
            margin-bottom: 20px;
            border-bottom: 1px solid #e2e8f0;
            padding-bottom: 15px;
        }

        table {
            width: 100%;
            border-collapse: collapse;
        }

        th,
        td {
            text-align: left;
            padding: 15px;
            border-bottom: 1px solid #f1f5f9;
        }

        th {
            color: var(--text-muted);
            font-weight: 600;
            font-size: 14px;
        }

        td {
            font-size: 15px;
        }

        .rating-stars {
            color: #fbbf24;
            letter-spacing: 2px;
        }

        .refresh-btn {
            display: block;
            margin: 0 auto 30px auto;
            background: var(--primary);
            color: white;
            border: none;
            padding: 10px 25px;
            border-radius: 50px;
            cursor: pointer;
            font-weight: 600;
            box-shadow: 0 4px 6px -1px rgba(37, 99, 235, 0.3);
            transition: transform 0.2s;
        }

        .refresh-btn:hover {
            transform: translateY(-2px);
        }

        .empty-state {
            text-align: center;
            padding: 40px;
            color: var(--text-muted);
        }

        @media (max-width: 768px) {
            body {
                padding: 16px;
            }

            .container {
                max-width: 100%;
            }

            h1 {
                font-size: 1.55rem;
                line-height: 1.2;
                margin-bottom: 22px;
            }

            .refresh-btn {
                width: 100%;
                min-height: 44px;
                margin-bottom: 20px;
                border-radius: 12px;
            }

            .stats-grid {
                grid-template-columns: 1fr;
                gap: 12px;
                margin-bottom: 20px;
            }

            .card,
            .feedback-section {
                padding: 18px;
                border-radius: 12px;
            }

            .card .value {
                font-size: 2.4rem;
            }

            #feedbackTableContainer {
                overflow-x: auto;
                -webkit-overflow-scrolling: touch;
                margin-inline: -4px;
                padding-bottom: 8px;
            }

            #feedbackTableContainer::after {
                content: "Swipe sideways to see all feedback columns";
                display: block;
                color: var(--text-muted);
                font-size: 0.78rem;
                text-align: center;
                padding-top: 8px;
            }

            table {
                min-width: 620px;
            }

            th,
            td {
                padding: 10px;
                white-space: nowrap;
            }

            td:last-child {
                white-space: normal;
                min-width: 240px;
            }
        }

        @media (max-width: 420px) {
            body {
                padding: 12px;
            }

            .card,
            .feedback-section {
                padding: 14px;
            }
        }
    </style>
</head>

<body>

    <div class="container">
        <h1>📊 3Ahub AI Bot Analytics</h1>

        <button class="refresh-btn" onclick="fetchStats()">🔄 Refresh Data</button>

        <div class="stats-grid">
            <div class="card">
                <h3>Daily Unique Visitors</h3>
                <p class="value" id="dailyVisits">-</p>
                <div class="sub">Unique users today</div>
            </div>
            <div class="card">
                <h3>Total Lifetime Visitors</h3>
                <p class="value" id="totalVisits">-</p>
                <div class="sub">All time tracking</div>
            </div>
            <div class="card">
                <h3>Average Rating</h3>
                <p class="value" id="avgRating">-</p>
                <div class="sub">Based on user feedback</div>
            </div>
        </div>

        <div class="feedback-section">
            <h2>💬 Recent Feedback</h2>
            <div id="feedbackTableContainer">
                <table>
                    <thead>
                        <tr>
                            <th>Date</th>
                            <th>Rating</th>
                            <th>Comment</th>
                        </tr>
                    </thead>
                    <tbody id="feedbackList">
                        <!-- Items will be injected here -->
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <script>
        async function fetchStats() {
            try {
                const response = await fetch('https://motionless-appolonia-3a-5a61944b.koyeb.app/api/stats');
                const data = await response.json();

                if (data.success) {
                    const stats = data.stats;

                    // Update Cards
                    animateValue("dailyVisits", stats.dailyUniqueVisitors);
                    animateValue("totalVisits", stats.totalAllTime);
                    document.getElementById("avgRating").innerText = stats.averageRating + " ★";

                    // Update Table
                    const tbody = document.getElementById("feedbackList");
                    tbody.innerHTML = "";

                    if (stats.recentFeedback.length === 0) {
                        tbody.innerHTML = `<tr><td colspan="3" class="empty-state">No feedback received yet.</td></tr>`;
                    } else {
                        stats.recentFeedback.forEach(fb => {
                            const date = new Date(fb.timestamp).toLocaleString();
                            const stars = "★".repeat(fb.rating) + "☆".repeat(5 - fb.rating);
                            const row = `
                                <tr>
                                    <td style="color:#64748b; font-size:13px;">${date}</td>
                                    <td><span class="rating-stars">${stars}</span></td>
                                    <td>${fb.comment ? fb.comment : '<span style="color:#cbd5e1; font-style:italic;">No comment</span>'}</td>
                                </tr>
                            `;
                            tbody.innerHTML += row;
                        });
                    }
                }
            } catch (error) {
                console.error("Error fetching stats:", error);
                alert("Could not connect to server. Make sure 'node server.js' is running.");
            }
        }

        // Simple animation for numbers
        function animateValue(id, end) {
            const obj = document.getElementById(id);
            if (end === 0) {
                obj.innerText = "0";
                return;
            }
            if (obj.innerText === end.toString()) return; // No change

            let startTimestamp = null;
            const duration = 1000;
            const step = (timestamp) => {
                if (!startTimestamp) startTimestamp = timestamp;
                const progress = Math.min((timestamp - startTimestamp) / duration, 1);
                obj.innerText = Math.floor(progress * end);
                if (progress < 1) {
                    window.requestAnimationFrame(step);
                } else {
                    obj.innerText = end;
                }
            };
            window.requestAnimationFrame(step);
        }

        // Load on start
        fetchStats();
    </script>

</body>

</html>
